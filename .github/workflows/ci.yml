name: CI/CD Pipeline

on:
  push:
    branches: [ main, "feature/*", "feat/*" ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies with uv
        run: |
          pip install uv
          # Install your project dependencies plus testing/linting tools
          uv pip install --system -r pyproject.toml ruff pytest httpx

      - name: Run Linter (Ruff)
        run: ruff check .

      - name: Run Unit Tests
        env:
          FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.cache/fastembed
          HF_HOME: ${{ github.workspace }}/.cache/huggingface
        run: pytest tests/test_crag_nodes.py

      - name: Verify Docker Build
        run: docker compose build --no-cache